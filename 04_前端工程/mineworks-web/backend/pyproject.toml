[project]
name = "mineworks-api"
version = "1.1.1"
description = "矿业智工平台 PostgreSQL、HttpOnly会话安全、订阅权益与 mining_core 计算核心"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.40,<1.0",
  "pydantic>=2.12,<3.0",
  "pydantic-settings>=2.12,<3.0",
  "sqlalchemy>=2.0.50,<2.1",
  "alembic>=1.18,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "argon2-cffi>=25.1,<26.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0,<10.0", "httpx>=0.28,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
