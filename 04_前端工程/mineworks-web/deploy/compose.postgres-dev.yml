name: mineworks-postgres-dev
services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: mineworks
      POSTGRES_USER: mineworks
      POSTGRES_PASSWORD: mineworks-dev-password
    ports:
      - "5432:5432"
    volumes:
      - mineworks_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineworks -d mineworks"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mineworks_postgres_dev:
